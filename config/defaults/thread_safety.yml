# Department 'ThreadSafety' (10):
# https://docs.rubocop.org/rubocop-thread_safety/cops_thread_safety.html#threadsafetyactivesupportcallbacks
ThreadSafety/ActiveSupportCallbacks:
  Description: Avoid mutating ActiveSupport callback chains at runtime.
  Enabled: true # was pending
  VersionAdded: '0.8'

# https://docs.rubocop.org/rubocop-thread_safety/cops_thread_safety.html#threadsafetyclassandmoduleattributes
ThreadSafety/ClassAndModuleAttributes:
  Description: Avoid mutating class and module attributes.
  Enabled: true
  ActiveSupportClassAttributeAllowed: false

# https://docs.rubocop.org/rubocop-thread_safety/cops_thread_safety.html#threadsafetyclassinstancevariable
ThreadSafety/ClassInstanceVariable:
  Description: Avoid class instance variables.
  Enabled: true

# https://docs.rubocop.org/rubocop-thread_safety/cops_thread_safety.html#threadsafetydirchdir
ThreadSafety/DirChdir:
  Description: Avoid using `Dir.chdir` due to its process-wide effect.
  Enabled: true
  AllowCallWithBlock: false

# https://docs.rubocop.org/rubocop-thread_safety/cops_thread_safety.html#threadsafetyenvmutation
ThreadSafety/EnvMutation:
  Description: Avoid mutating `ENV` due to its process-wide effect.
  Enabled: true # was false
  VersionAdded: '0.8'

# https://docs.rubocop.org/rubocop-thread_safety/cops_thread_safety.html#threadsafetylazysynchronizationprimitive
ThreadSafety/LazySynchronizationPrimitive:
  Description: Do not lazily initialize synchronization primitives with `||=`.
  Enabled: true # was pending
  VersionAdded: '0.8'

# https://docs.rubocop.org/rubocop-thread_safety/cops_thread_safety.html#threadsafetymethodredefinition
ThreadSafety/MethodRedefinition:
  Description: Do not use `remove_method` followed by method definition.
  Enabled: true # was pending
  VersionAdded: '0.8'
  References:
  - https://bugs.ruby-lang.org/issues/13574

# Supports --autocorrect
# https://docs.rubocop.org/rubocop-thread_safety/cops_thread_safety.html#threadsafetymutableclassinstancevariable
ThreadSafety/MutableClassInstanceVariable:
  Description: Do not assign mutable objects to class instance variables.
  Enabled: true
  EnforcedStyle: literals
  SafeAutoCorrect: false
  SupportedStyles:
  - literals
  - strict

# https://docs.rubocop.org/rubocop-thread_safety/cops_thread_safety.html#threadsafetynewthread
ThreadSafety/NewThread:
  Description: Avoid starting new threads. Let a framework like Sidekiq handle the threads.
  Enabled: true

# https://docs.rubocop.org/rubocop-thread_safety/cops_thread_safety.html#threadsafetyrackmiddlewareinstancevariable
ThreadSafety/RackMiddlewareInstanceVariable:
  Description: Avoid instance variables in Rack middleware.
  Enabled: true
  Include:
  - app/middleware/**/*.rb
  - lib/middleware/**/*.rb
  - app/middlewares/**/*.rb
  - lib/middlewares/**/*.rb
  AllowedIdentifiers: []

